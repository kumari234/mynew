name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository code to the runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Installs Java on the runner
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Displays Java and Maven versions
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # Compiles the code, runs tests and creates the JAR/WAR
      - name: Build and test application
        run: mvn clean verify

      # Saves the generated artifact
      - name: Upload application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: java-application-${{ github.run_number }}
          path: |
            target/*.jar
            target/*.war
          if-no-files-found: error
          retention-days: 7
