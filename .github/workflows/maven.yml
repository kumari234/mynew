name: CICD pipeline with java based application

On: 
 push: 
   branches: [main]
 pull_request:
   branches: [main, dev]
workflow_dispatch:

permissions: 
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout source code
      uses: actions/checkout@v4

    - name: configure java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        version: '17'
        cache: maven

    - name: build and test
      run: mvn clean verify

    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-application
        path: /target/*.jar

docker: 
  if github.event_name == 'push'
  needs: build
  runs-on: ubuntu-latest

  steps:
  - name: checkout source code
    uses: actions/checkout@v4

  - name: download artifact
    uses: actions/download-artifact@v4
    with:
      name: java-application
      path: target

  - name: docker login
    uses: docker/login-action@v3
    with: 
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: build docker image
    run: | 
    docker build \
      -t ${{ secrets.DOCKERHUB_USERNAME }}/java-app:{{ github.sha }} .

  - name: push docker image
    run: |
    docker push \
      ${{ secrets.DOCKERHUB_USERNAME }}/java-app:{{ github.sha }}

deploy-dev:
  needs: docker
  runs-on: ubuntu-latest
  environment: development
  
 steps: 
 - name: deploy
   run: ./deploy.sh development {{ github.sha }}

 - name: health check
   run: curl --fail --retry 5 https://github.com

deploy-production:
  needs: deploy-dev
  runs-on: ubuntu-latest
  environment: production

  steps:
  - name: deploy
    run: ./deploy.sh production {{ github.sha }}

  - name: health check
    run: curl --fail --retry 5 https://github.com/health
    

   
    
    
